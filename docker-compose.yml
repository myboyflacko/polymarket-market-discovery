services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POLYMARKET_DISCOVERY_POSTGRES_DB:-polymarket_market_discovery}
      POSTGRES_USER: ${POLYMARKET_DISCOVERY_POSTGRES_USER:-polymarket_market_discovery}
      POSTGRES_PASSWORD: ${POLYMARKET_DISCOVERY_POSTGRES_PASSWORD:-polymarket_market_discovery}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POLYMARKET_DISCOVERY_POSTGRES_USER:-polymarket_market_discovery} -d ${POLYMARKET_DISCOVERY_POSTGRES_DB:-polymarket_market_discovery}
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - polymarket-discovery-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - ${POLYMARKET_DISCOVERY_POSTGRES_PORT:-5432}:5432

  scheduler:
    build: .
    image: polymarket-market-discovery:latest
    command: ["polymarket-market-discovery", "schedule"]
    environment: &app-environment
      POLYMARKET_DISCOVERY_POSTGRES_DB: ${POLYMARKET_DISCOVERY_POSTGRES_DB:-polymarket_market_discovery}
      POLYMARKET_DISCOVERY_POSTGRES_USER: ${POLYMARKET_DISCOVERY_POSTGRES_USER:-polymarket_market_discovery}
      POLYMARKET_DISCOVERY_POSTGRES_PASSWORD: ${POLYMARKET_DISCOVERY_POSTGRES_PASSWORD:-polymarket_market_discovery}
      POLYMARKET_DISCOVERY_POSTGRES_HOST: postgres
      POLYMARKET_DISCOVERY_POSTGRES_PORT: 5432
      POLYMARKET_DISCOVERY_LOG_LEVEL: ${POLYMARKET_DISCOVERY_LOG_LEVEL:-INFO}
      POLYMARKET_DATA_API_BASE_URL: ${POLYMARKET_DATA_API_BASE_URL:-https://data-api.polymarket.com}
      POLYMARKET_GAMMA_API_BASE_URL: ${POLYMARKET_GAMMA_API_BASE_URL:-https://gamma-api.polymarket.com}
      POLYMARKET_CLOB_API_BASE_URL: ${POLYMARKET_CLOB_API_BASE_URL:-https://clob.polymarket.com}
      POLYMARKET_POSITIONS_REQUESTS_PER_SECOND: ${POLYMARKET_POSITIONS_REQUESTS_PER_SECOND:-8}
      POLYMARKET_LEADERBOARD_REQUESTS_PER_SECOND: ${POLYMARKET_LEADERBOARD_REQUESTS_PER_SECOND:-3}
      POLYMARKET_GAMMA_API_REQUESTS_PER_SECOND: ${POLYMARKET_GAMMA_API_REQUESTS_PER_SECOND:-5}
      POLYMARKET_ORDERBOOK_REQUESTS_PER_SECOND: ${POLYMARKET_ORDERBOOK_REQUESTS_PER_SECOND:-5}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cli:
    build: .
    image: polymarket-market-discovery:latest
    entrypoint: ["polymarket-market-discovery"]
    command: ["--help"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  polymarket-discovery-postgres-data:
