[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-market-discovery"
version = "0.1.0"
description = "Discover whale-held Polymarket markets and collect their orderbooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.17.2",
    "asynciolimiter==1.2.0",
    "httpx==0.28.1",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.2",
    "psycopg[binary]==3.3.4",
    "sqlalchemy==2.0.49",
    "python-json-logger==4.1.0",
    "ruff>=0.15.14",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.14",
]

[project.scripts]
polymarket-market-discovery = "polymarket_market_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["polymarket_market_discovery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
